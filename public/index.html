<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Vehicle Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-900 text-white h-full flex flex-col m-0 p-0 overflow-hidden">

  <!-- Header -->
  <header class="p-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center shrink-0">
    <h1 class="text-xl font-bold flex items-center gap-2">
      <span class="bg-indigo-600 px-2 py-1 rounded-lg text-sm">GPS</span> 
      Live Vehicle Location Tracker
    </h1>
  </header>

  <!-- Main Content Layout -->
  <div class="flex flex-1 h-[calc(100vh-65px)] overflow-hidden">
    
    <!-- Left Sidebar -->
    <div class="w-80 bg-slate-800/50 p-4 border-r border-slate-700 flex flex-col shrink-0">
      
      <!-- WhatsApp Sharing Section -->
      <div class="bg-slate-800 p-3 rounded-lg border border-slate-700 mb-4">
        <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase tracking-wider">
          Send Tracking Link
        </label>
        <div class="flex flex-col gap-2">
          <input 
            type="text" 
            id="whatsappPhone" 
            placeholder="Driver Phone (e.g. 919876543210)" 
            class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
          />
          <button 
            onclick="sendWhatsAppLink()" 
            class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-lg font-semibold text-sm transition flex items-center justify-center gap-2">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
              <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/>
            </svg>
            Send via WhatsApp
          </button>
        </div>
      </div>

      <!-- Search Vehicle Section -->
      <div class="flex gap-2 mb-4">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search Plate or Phone..." 
          class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
        <button onclick="searchVehicle()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg font-semibold text-sm transition">
          Find
        </button>
      </div>

      <!-- Vehicle Cards Target -->
      <div id="vehicleList" class="flex-1 overflow-y-auto space-y-3"></div>
    </div>

    <!-- Google Map Target -->
    <div class="flex-1 h-full w-full relative">
      <div id="map" style="width: 100%; height: 100%;"></div>
    </div>

  </div>

  <!-- WhatsApp Trigger Script -->
  <script>
    function sendWhatsAppLink() {
  const input = document.getElementById('whatsappPhone').value.trim();
  const phone = input.replace(/[^0-9]/g, '');
  
  if (!phone || phone.length < 10) {
    alert("Please enter a valid phone number with country code.");
    return;
  }

  // Pass the phone number directly in the URL query string
  const trackingUrl = `https://vehicle-tracker-app-ysdj.onrender.com/driver.html?phone=${phone}`;
  const message = `Hello! Please click this link on your phone to allow live location tracking: ${trackingUrl}`;
  
  const waUrl = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
  window.open(waUrl, '_blank');
}
  </script>

  <!-- Google Maps Script with async parameter -->
  <script 
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDLaRI8ItoDvFOCvkByp6gLmJqgnW9CJ-U&callback=initMap&loading=async" 
    async 
    defer>
  </script>
  <script src="/app.js"></script>
</body>
</html>
