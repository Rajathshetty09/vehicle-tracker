<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live User Location Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 flex items-center gap-3">
    <span class="bg-indigo-600 text-white font-bold px-2 py-1 rounded text-xs">GPS</span>
    <h1 class="text-lg font-bold">Live User Location Tracker</h1>
  </header>

  <!-- Main Container -->
  <div class="flex flex-1 overflow-hidden">
    
    <!-- Left Sidebar -->
    <aside class="w-80 bg-slate-900/80 border-r border-slate-800 p-4 flex flex-col gap-4 overflow-y-auto">
      
      <!-- Source Location Box -->
      <div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700/60 space-y-2">
        <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Source Location (My Position)</h2>
        <button 
          onclick="setSourceFromCurrentLocation()"
          class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold py-2 px-3 rounded transition">
          📍 Use My Current Location as Source
        </button>
        <p id="sourceStatus" class="text-[11px] text-slate-400 font-mono">Source: Not Set</p>
      </div>

      <!-- Send Tracking Link -->
      <div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700/60 space-y-2">
        <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Send Tracking Link</h2>
        <input 
          type="tel" 
          id="whatsappPhone" 
          placeholder="User Phone (e.g. 919876543210)" 
          class="w-full bg-slate-900 border border-slate-700 text-xs text-white p-2.5 rounded focus:outline-none focus:ring-1 focus:ring-indigo-500"
        />
        <button 
          onclick="sendWhatsAppLink()"
          class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold py-2.5 rounded transition">
          Send via WhatsApp
        </button>
      </div>

      <!-- Search Bar -->
      <div class="flex gap-2">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search Name, ID or Phone..." 
          class="flex-1 bg-slate-900 border border-slate-700 text-xs text-white p-2 rounded focus:outline-none focus:ring-1 focus:ring-indigo-500"
        />
        <button class="bg-indigo-600 text-xs text-white px-3 py-2 rounded hover:bg-indigo-500 transition">Find</button>
      </div>

      <!-- ACTIVE DRIVERS LIST CONTAINER (CRITICAL: Must exist so app.js can inject cards!) -->
      <div class="flex-1">
        <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Active Tracked Users</h2>
        <div id="userList" class="space-y-3">
          <!-- Live cards injected here dynamically -->
        </div>
      </div>

    </aside>

    <!-- Right Map Container -->
    <main class="flex-1 relative">
      <div id="map" class="w-full h-full min-h-[500px]"></div>
    </main>

  </div>

  <script src="/app.js"></script>
</body>
</html>
