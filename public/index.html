<script>
    function sendWhatsAppLink() {
      const input = document.getElementById('whatsappPhone').value.trim();
      const phone = input.replace(/[^0-9]/g, '');
      
      if (!phone || phone.length < 10) {
        alert("Please enter a valid phone number with country code.");
        return;
      }

      const trackingUrl = `https://vehicle-tracker-app-ysdj.onrender.com/driver.html?phone=${phone}`;
      const message = `Hello! Please click this link to enable live location tracking: ${trackingUrl}`;
      
      const waUrl = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
      window.open(waUrl, '_blank');
    }
  </script>
