<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live User Tracker with Routing</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>

  <!-- Leaflet CSS & JS (Fixed CSS URL) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet Routing Machine -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.min.js"></script>

  <style>
    /* Ensure map container takes full explicit dimensions */
    #map {
      width: 100%;
      height: 100%;
      min-height: 100%;
      z-index: 1;
    }
  </style>
</head>
<body class="bg-slate-900 text-white h-full flex flex-col m-0 p-0 overflow-hidden">

  <!-- Header -->
  <header class="p-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center shrink-0">
    <h1 class="text-xl font-bold flex items-center gap-2">
      <span class="bg-indigo-600 px-2 py-1 rounded-lg text-sm">GPS</span> 
      Live User Location Tracker
    </h1>
  </header>

  <!-- Main Content Layout -->
  <div class="flex flex-1 h-[calc(100vh-65px)] overflow-hidden">
    
    <!-- Left Sidebar -->
    <div class="w-80 bg-slate-800/50 p-4 border-r border-slate-700 flex flex-col shrink-0 overflow-y-auto">
      
      <!-- Source / My Location Section -->
      <div class="bg-slate-800 p-3 rounded-lg border border-slate-700 mb-4 space-y-2">
        <label class="block text-xs text-slate-400 font-semibold uppercase tracking-wider">
          Source Location (My Position)
        </label>
        <button 
          onclick="setSourceFromCurrentLocation()" 
          class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-lg font-semibold text-xs transition flex items-center justify-center gap-1">
          📍 Use My Current Location as Source
        </button>
        <div id="sourceStatus" class="text-[11px] text-slate-400 font-mono">Source: Not Set</div>
      </div>

      <!-- WhatsApp Link Generator -->
      <div class="bg-slate-800 p-3 rounded-lg border border-slate-700 mb-4">
        <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase tracking-wider">
          Send Tracking Link
        </label>
        <div class="flex flex-col gap-2">
          <input 
            type="text" 
            id="whatsappPhone" 
            placeholder="User Phone (e.g. 919876543210)" 
            class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
          />
          <button 
            onclick="sendWhatsAppLink()" 
            class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-lg font-semibold text-sm transition flex items-center justify-center gap-2">
            Send via WhatsApp
          </button>
        </div>
      </div>

      <!-- Search Section -->
      <div class="flex gap-2 mb-4">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search Name, ID or Phone..." 
          class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
        <button onclick="searchUser()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg font-semibold text-sm transition">
          Find
        </button>
      </div>

      <!-- Route Details Panel -->
      <div id="routeDetails" class="hidden bg-slate-800 p-3 rounded-lg border border-indigo-500/50 mb-4 space-y-1">
        <h4 class="text-xs font-bold text-indigo-400 uppercase">Route Details</h4>
        <p class="text-xs text-slate-300">Distance: <span id="routeDistance" class="font-bold text-white">--</span></p>
        <p class="text-xs text-slate-300">Est. Time: <span id="routeTime" class="font-bold text-white">--</span></p>
      </div>

      <!-- User Cards List -->
      <div id="userList" class="flex-1 space-y-3"></div>
    </div>

    <!-- Map Area -->
    <div class="flex-1 h-full w-full relative bg-slate-950">
      <div id="map"></div>
    </div>

  </div>

  <script>
    function sendWhatsAppLink() {
      const input = document.getElementById('whatsappPhone').value.trim();
      const phone = input.replace(/[^0-9]/g, '');
      if (!phone || phone.length < 10) {
        alert("Please enter a valid phone number with country code.");
        return;
      }
      
      // Use deployed Render URL if live, or current origin for local test
      const host = window.location.origin.includes('localhost') 
        ? "https://vehicle-tracker-app-ysdj.onrender.com" 
        : window.location.origin;

      const trackingUrl = `${host}/driver.html?phone=${phone}`;
      const message = `Hello! Please click this link to enable live location tracking: ${trackingUrl}`;
      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
    }
  </script>

  <script src="/app.js"></script>
</body>
</html>
