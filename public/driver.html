<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver Location Sharing</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 w-full max-w-sm space-y-4 text-center">
    <h2 class="text-xl font-bold">GPS Tracker Access</h2>
    <p class="text-xs text-slate-400">Enter your name to start sharing live location:</p>

    <input 
      type="text" 
      id="driverName" 
      placeholder="Your Name (e.g. Khushi)" 
      class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
    />

    <button 
      id="shareBtn"
      onclick="startTracking()" 
      class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-lg font-bold text-sm transition">
      Share My Location
    </button>

    <div id="statusMessage" class="text-xs text-emerald-400 font-semibold hidden">
      ✓ Broadcasting Live Location!
    </div>
  </div>

  <script>
    const socket = io();
    let watchId = null;

    // Get phone parameter from URL query string
    const urlParams = new URLSearchParams(window.location.search);
    const driverPhone = urlParams.get('phone') || '';

    function startTracking() {
      const nameInput = document.getElementById('driverName').value.trim();
      if (!nameInput) {
        alert('Please enter your name.');
        return;
      }

      if (!navigator.geolocation) {
        alert('Geolocation is not supported by your browser.');
        return;
      }

      const statusMsg = document.getElementById('statusMessage');
      const shareBtn = document.getElementById('shareBtn');

      // Request live location tracking with high accuracy
      watchId = navigator.geolocation.watchPosition(
        (position) => {
          const { latitude, longitude } = position.coords;

          // Emit to server
          socket.emit('updateLocation', {
            id: driverPhone || socket.id,
            name: nameInput,
            phone: driverPhone,
            lat: latitude,
            lng: longitude
          });

          statusMsg.classList.remove('hidden');
          shareBtn.innerText = 'Sharing Active...';
          shareBtn.disabled = true;
          shareBtn.classList.add('opacity-50', 'cursor-not-allowed');
        },
        (error) => {
          console.error('GPS Error:', error);
          alert('GPS permission denied or unavailable. Please enable Location Services on your device.');
        },
        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 10000
        }
      );
    }
  </script>
</body>
</html>
