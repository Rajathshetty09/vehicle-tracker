<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Live Location</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 w-full max-w-md text-center space-y-4">
    <h1 class="text-xl font-bold">GPS Location Sharer</h1>
    <p class="text-xs text-slate-400">Keep this tab open to continuously share your location.</p>

    <!-- Name & Phone Inputs -->
    <div class="space-y-3 text-left">
      <div>
        <label class="text-xs font-semibold text-slate-400">Your Name</label>
        <input 
          type="text" 
          id="userName" 
          placeholder="e.g. John Doe" 
          class="w-full px-3 py-2 mt-1 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
      </div>

      <div>
        <label class="text-xs font-semibold text-slate-400">Phone / Identifier</label>
        <input 
          type="text" 
          id="userPhone" 
          placeholder="e.g. 919876543210" 
          class="w-full px-3 py-2 mt-1 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
      </div>
    </div>

    <!-- Status Output -->
    <div id="statusBox" class="p-3 bg-slate-900 rounded-lg text-xs font-mono text-slate-400 border border-slate-700">
      Status: Ready to start...
    </div>

    <button 
      onclick="startTracking()" 
      class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl font-bold text-sm transition">
      Start Sharing Location
    </button>
  </div>

  <script>
    // Pre-fill phone from URL params if present (e.g. ?phone=919876543210)
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('phone')) {
      document.getElementById('userPhone').value = urlParams.get('phone');
    }

    let watchId = null;

    async function getBatteryInfo() {
      if ('getBattery' in navigator) {
        try {
          const battery = await navigator.getBattery();
          return { level: Math.round(battery.level * 100), isCharging: battery.charging };
        } catch (e) {}
      }
      return { level: null, isCharging: false };
    }

    async function sendLocation(position) {
      const name = document.getElementById('userName').value.trim();
      const phone = document.getElementById('userPhone').value.trim();
      const statusBox = document.getElementById('statusBox');

      if (!phone) {
        statusBox.innerText = "Error: Please enter a phone number!";
        return;
      }

      const battery = await getBatteryInfo();

      const payload = {
        identifier: phone,
        name: name || undefined,
        lat: position.coords.latitude,
        lng: position.coords.longitude,
        speed: position.coords.speed || 0,
        batteryLevel: battery.level,
        isCharging: battery.isCharging
      };

      fetch('/api/user/update-location', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        statusBox.innerHTML = `
          <span class="text-emerald-400 font-semibold">✓ Broadcasting Live</span><br/>
          Lat: ${payload.lat.toFixed(4)}, Lng: ${payload.lng.toFixed(4)}
        `;
      })
      .catch(err => {
        statusBox.innerText = "Connection error while sending updates.";
      });
    }

    function startTracking() {
      const statusBox = document.getElementById('statusBox');

      if (!navigator.geolocation) {
        statusBox.innerText = "Geolocation is not supported by your browser.";
        return;
      }

      statusBox.innerText = "Requesting GPS permissions...";

      watchId = navigator.geolocation.watchPosition(
        sendLocation,
        (err) => { statusBox.innerText = `GPS Error: ${err.message}`; },
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
      );
    }
  </script>
</body>
</html>
