<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Your Location</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 2rem; background: #121826; color: #fff; }
    .card { max-width: 400px; margin: 0 auto; background: #1a2332; padding: 20px; border-radius: 12px; }
    input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #334155; }
    button { width: 95%; padding: 14px; background: #10b981; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    #status { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h2>GPS Tracker Access</h2>
    <p>Enter your name to start sharing live location:</p>
    <input type="text" id="userName" placeholder="Your Name (e.g. Alex)" />
    <button id="startBtn">Share My Location</button>
    <p id="status"></p>
  </div>

  <script>
    // Automatically capture phone number from URL query string if present (e.g. ?phone=919876543210)
    const urlParams = new URLSearchParams(window.location.search);
    const identifier = urlParams.get('phone') || 'USER-' + Math.floor(1000 + Math.random() * 9000);

    let watchId = null;

    document.getElementById('startBtn').addEventListener('click', () => {
      const nameInput = document.getElementById('userName').value.trim();
      const statusDiv = document.getElementById('status');

      if (!nameInput) {
        alert("Please enter your name first!");
        return;
      }

      if (!navigator.geolocation) {
        statusDiv.innerText = "Geolocation is not supported by your browser.";
        return;
      }

      statusDiv.style.color = "#f59e0b";
      statusDiv.innerText = "Requesting location access...";

      // Continuously monitor and send GPS updates
      watchId = navigator.geolocation.watchPosition(
        (position) => {
          const payload = {
            identifier: identifier,
            name: nameInput,
            lat: position.coords.latitude,
            lng: position.coords.longitude,
            speed: position.coords.speed || 0
          };

          fetch('/api/user/update-location', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          })
          .then(res => res.json())
          .then(() => {
            statusDiv.style.color = "#10b981";
            statusDiv.innerText = "✓ Broadcasting Live Location!";
          })
          .catch(err => {
            statusDiv.style.color = "#ef4444";
            statusDiv.innerText = "Error sending location update.";
          });
        },
        (error) => {
          statusDiv.style.color = "#ef4444";
          statusDiv.innerText = "Permission denied or GPS unavailable: " + error.message;
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    });
  </script>
</body>
</html>
